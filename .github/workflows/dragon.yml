name: Dragon
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/dragon.yml']
permissions:
  contents: write
concurrency: dragon
jobs:
  dragon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: loganhutcheson/git-koi@cec575f20a5c776b5dfb87264bfe4a5ee319fe54
        with:
          output-dir: dragon
      - name: Commit dragon if changed
        shell: bash
        run: |
          git add dragon/dragon.gif dragon/dragon.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update the flying dragon'
          git push
